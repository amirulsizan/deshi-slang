fields:
  - name: id
    type: string
    description: Unique identifier for the example
    required: true
  - name: text
    type: string
    description: The Bengali text (UTF-8)
    required: true
  - name: labels
    type: array[string]
    description: One or more labels from the label taxonomy
    required: true
  - name: language
    type: string
    description: ISO language code, e.g. 'bn'
    required: true
  - name: source
    type: string
    description: (optional) source or provenance metadata
    required: false
  - name: annotator_id
    type: string
    description: (optional) annotator identifier
    required: false
  - name: split
    type: string
    description: Data split (train/validation/test)
    required: true

label_taxonomy:
  # Original labels (6)
  - abusive
  - slur
  - derogatory
  - sexual
  - slang
  - neutral
  # Extended moderation labels (9)
  - profanity
  - sexual_slang
  - hate_speech
  - harassment
  - threat
  - spam
  - self_harm
  - toxic
  - severe_toxicity
